<!DOCTYPE html>
<html>
	<head>
		
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">

		<title>Buttons &mdash; Avery Ominsky</title>

		<link href='https://fonts.googleapis.com/css?family=Open+Sans:400,300,300italic,400italic,600,600italic,700,700italic,800,800italic' rel='stylesheet' type='text/css'>
		<link href='https://fonts.googleapis.com/css?family=Montserrat' rel='stylesheet' type='text/css'>
		<link href='https://fonts.googleapis.com/css?family=Ubuntu:700' rel='stylesheet' type='text/css'>

		<link href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet" integrity="sha384-wvfXpqpZZVQGK6TAh5PVlGOfQNHSoD2xbE+QkPxCAFlNEevoEH3Sl0sibVcOQVnN" crossorigin="anonymous">
        
        <script src="https://kit.fontawesome.com/5664cbb649.js" crossorigin="anonymous"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:ital,wght@0,400..700;1,400..700&family=Arvo:ital,wght@0,400;0,700;1,400;1,700&family=Black+Ops+One&family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Great+Vibes&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Rampart+One&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">



		<style>

			body {
				color: #333;
				font-family: 'Open Sans', sans-serif;
				margin: 0;
				padding: 0;
			}

			main {
				margin: 40px;
			}

			h1 {
			 	font-size: 30px;
			 	margin-bottom: 40px;
			}

			.button_container {
				border: 1px solid #ddd;
				margin: 0 10px 10px 0;
				padding: 20px;
				width: 300px;
				height: 300px;
				float: left;
				overflow: hidden;
				box-sizing: border-box;
				text-align: center;
			}



			a#btn_harleydavidson {
				display: inline-block;
				height: 45px;
				box-sizing: border-box;
				margin: auto;
				margin-top: 100px;
				padding: 10px 40px 0 40px;
				background-color: #F58220;
				border: 2px solid #2B2E33;
				color: #2B2E33;
				font-size: 18px;
				font-family: 'Archivo Black', sans-serif;
				font-weight: bold;
				text-decoration: none;
				transition: all .5s;
			}
			a#btn_harleydavidson:hover {
				background-color: #fff;
				border: 2px solid #000;
				color: #000;
			}

            a#btn_harleydavidson {
  position: relative;
  
}

a#btn_harleydavidson .bike {
  position: absolute;
  bottom: 100%;            
  left: 0;                 
  font-size: 30px;
  line-height: 1;
  color: #F58220;
  pointer-events: none;
}

a#btn_harleydavidson:hover .bike {
  animation: ride 1.2s ease-in-out forwards;
}

@keyframes ride {
  0%   { opacity: 0; }
  10%  { opacity: 1; }
  90%  { opacity: 1; }
  100% { left: 100%; opacity: 0; }
}





a#btn_army {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  height: 64px;
  box-sizing: border-box;
  margin: auto;
  margin-top: 90px;
  padding: 0 24px 0 18px;
  background-color: #615d5d;
  color: #fff;
  font-family: "Black Ops One", system-ui;
  font-weight: 400;
  font-size: 30px;
  letter-spacing: .5px;
  text-decoration: none;
  transition: background-color .3s;
}

a#btn_army:hover {
  background-color: #000;
}

a#btn_army .fa-star {
  font-size: 30px;
  color: #fff;
  transition: transform .6s ease, color .3s;
}

a#btn_army:hover .fa-star {
  color: #ffcc01;
}


a#btn_ibm {
  display: inline-block;
  margin-top: 100px;
  background: none;
  color: #1f70c1;                  /* IBM logo blue */
    font-family: "Arvo", serif;
  font-weight: 700;
  font-style: normal;
  font-size: 80px;
  line-height: 1;
  letter-spacing: 4px;
  text-decoration: none;
  transition: color .3s;
}

a#btn_ibm:hover {
  color: #ffffff;
  text-shadow:
    0 0 6px #1f70c1,
    0 0 14px #1f70c1,
    0 0 28px #1f70c1;
}





a#btn_cocacola {
  display: inline-block;
  height: 60px;
  box-sizing: border-box;
  margin-top: 100px;
  padding: 0 20px;
  line-height: 60px;               
  background-color: #e61a27;       
  border: 2px solid #e61a27;
  border-radius: 30px;
  color: #fff;
  font-family: "Great Vibes", cursive;
  font-weight: 400;
  font-style: normal;
  font-size: 30px;
  text-decoration: none;
  transition: background-color .3s, color .3s;
}

a#btn_cocacola:hover {
  background-color: #fff;
  color: #e61a27;
}




a#btn_oldnavy {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 220px;
  height: 110px;
  box-sizing: border-box;
  margin: auto;
  margin-top: 70px;
  background-color: #002d62;      
  border-radius: 50%;             
  color: #fff;
  font-family: 'Nunito', sans-serif;
  font-weight: 900;
  font-size: 30px;
  letter-spacing: 1px;
  text-decoration: none;
  transition: box-shadow .3s, transform .3s;
}

a#btn_oldnavy:hover {
  box-shadow: 0 8px 0 #e8d589;     
  transform: translateY(-4px);     
}


		</style>
	</head>
	<body>
		
		<main>

			<h1>Button Styling &mdash; Avery Ominsky</h1>
			
			<div class="button_container">
				<a href="https://www.harley-davidson.com/us/en/index.html" target="_blank" id="btn_harleydavidson">HARLEY DAVIDSON<i class="fa-solid fa-motorcycle bike"></i>
                </a>
			</div>

		<div class="button_container">
  <a href="https://www.army.mil/" target="_blank" id="btn_army">
    <span>U.S. ARMY</span><i class="fa-solid fa-star"></i>
  </a>
</div>

			<div class="button_container">
				<a href="https://www.ibm.com/us-en" target="_blank" id="btn_ibm">IBM</a>
			</div>

			<div class="button_container">
				<a href="https://www.coca-cola.com/us/en" target="_blank" id="btn_cocacola"><span>Coca Cola</span></a>
			</div>

            <div class="button_container">
				<a href="https://oldnavy.gap.com/" target="_blank" id="btn_oldnavy"><span>Old Navy</span></a>
			</div>

		</main>	

	</body>
</html>
